<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Cafe Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="map"></div>

  <div id="spinner" class="spinner-overlay" aria-live="polite" aria-label="Loading map data">
    <div class="spinner-ring"></div>
    <span class="spinner-label">Brewing results…</span>
  </div>

  <header class="search-container" role="search" aria-label="Search for a city">
    <div class="search-inner">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search a city or place…"
        autocomplete="off"
        spellcheck="false"
        aria-autocomplete="list"
        aria-controls="suggestions"
        aria-haspopup="listbox"
      />
      <button id="clearBtn" class="clear-btn" aria-label="Clear search" title="Clear" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <ul id="suggestions" class="suggestions-list" role="listbox" aria-label="City suggestions"></ul>
  </header>

  <div class="map-brand" aria-hidden="true">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18.5 3A3.5 3.5 0 0 0 15 6.5c0 2.625 3.5 6.5 3.5 6.5S22 9.125 22 6.5A3.5 3.5 0 0 0 18.5 3zm0 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM9 2C6.24 2 4 4.24 4 7c0 3.75 5 11 5 11s5-7.25 5-11c0-2.76-2.24-5-5-5zm0 7.5C7.62 9.5 6.5 8.38 6.5 7S7.62 4.5 9 4.5 11.5 5.62 11.5 7 10.38 9.5 9 9.5z"/></svg>
    <span>CAFÉ FINDER</span>
  </div>

  <button id="geoBtn" class="fab" title="Use my location" aria-label="Locate me and find nearby cafes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      <circle cx="12" cy="12" r="7" stroke-dasharray="4 2"/>
    </svg>
  </button>

  <div id="cafeCount" class="cafe-count" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
